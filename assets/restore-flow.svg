<g fill="#a6d6bd" font-size="13"><text x="57" y="107">01 / SOURCE</text><text x="349" y="107">02 / RUNTIME</text><text x="641" y="107">03 / CONFIGURATION</text><text x="933" y="107">04 / VERIFICATION</text></g>
