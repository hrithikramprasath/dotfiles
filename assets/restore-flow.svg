<g fill="#a0b7a6" font-size="14"><text x="57" y="178">Manifests + preferences</text><text x="349" y="178">Packages + pinned iNiR</text><text x="641" y="178">Home files + QML overlays</text><text x="933" y="178">Drift + runtime health</text></g>
