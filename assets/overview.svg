<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Dotfiles — a considered desktop</title>
  <desc id="desc">Arch Linux, Niri and iNiR configuration, managed with chezmoi. An abstract illustration shows a scrolling workspace and floating desktop controls.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e1b"/><stop offset="1" stop-color="#233d34"/></linearGradient>
    <linearGradient id="pane" x2="0" y2="1"><stop stop-color="#34584b"/><stop offset="1" stop-color="#243c33"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9bcab6" stroke-opacity=".05"/></pattern>
    <clipPath id="round"><rect width="1440" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1440" height="640" fill="url(#bg)"/>
    <rect width="1440" height="640" fill="url(#grid)"/>
    <circle cx="1370" cy="120" r="270" fill="#b5d0aa" opacity=".045"/>
    <circle cx="1410" cy="140" r="380" fill="none" stroke="#b5d0aa" stroke-opacity=".12"/>
    <g font-family="Inter, DejaVu Sans, sans-serif">
      <rect x="70" y="65" width="8" height="8" rx="4" fill="#a6d6bd"/>
      <text x="93" y="77" fill="#a6d6bd" font-size="15" letter-spacing="3">PERSONAL ENVIRONMENT / ARCH LINUX</text>
      <text x="65" y="221" fill="#f0efe3" font-size="89" font-weight="700" letter-spacing="-5">Dotfiles.</text>
      <text x="70" y="280" fill="#c6d7cb" font-size="27">A considered desktop.</text>
      <text x="70" y="342" fill="#93ac9f" font-size="20">Scrollable workspaces. Quiet surfaces.</text>
      <text x="70" y="374" fill="#93ac9f" font-size="20">A restore recipe you can inspect.</text>
      <g font-size="14" fill="#d3e6d9">
        <rect x="70" y="435" width="80" height="38" rx="19" fill="#2b463b"/><text x="94" y="460">Niri</text>
        <rect x="162" y="435" width="83" height="38" rx="19" fill="#2b463b"/><text x="185" y="460">iNiR</text>
        <rect x="257" y="435" width="120" height="38" rx="19" fill="#2b463b"/><text x="280" y="460">chezmoi</text>
      </g>
      <path d="M70 534H568" stroke="#466052"/>
      <text x="70" y="573" fill="#91aa9c" font-size="14">CONFIGURATION · SOURCE OVERLAYS · DOCUMENTATION</text>
      <g transform="translate(650 120)">
        <rect width="720" height="402" rx="24" fill="#10221b" stroke="#6b8e79" stroke-opacity=".6"/>
        <rect x="20" y="18" width="680" height="33" rx="16" fill="#304b3e"/>
        <circle cx="41" cy="35" r="5" fill="#a6d6bd"/>
        <rect x="58" y="31" width="60" height="7" rx="3" fill="#6b8e79"/>
        <rect x="294" y="25" width="96" height="20" rx="10" fill="#a6d6bd"/>
        <text x="316" y="39" fill="#20382e" font-size="11" font-weight="600">workspace</text>
        <rect x="25" y="77" width="320" height="292" rx="16" fill="url(#pane)"/>
        <g transform="translate(46 99)">
          <circle r="4" cx="5" cy="5" fill="#c5d6ae"/><circle r="4" cx="20" cy="5" fill="#99bfac"/><circle r="4" cx="35" cy="5" fill="#6f9d88"/>
          <text x="0" y="55" fill="#d7e6db" font-size="17" font-family="monospace">~ / dotfiles</text>
          <text x="0" y="92" fill="#a6d6bd" font-size="14" font-family="monospace">$ chezmoi diff</text>
          <rect x="0" y="116" width="193" height="7" rx="3" fill="#557c67"/>
          <rect x="0" y="136" width="242" height="7" rx="3" fill="#557c67"/>
          <rect x="0" y="156" width="154" height="7" rx="3" fill="#557c67"/>
          <rect x="0" y="195" width="226" height="41" rx="9" fill="#a6d6bd"/>
          <text x="18" y="221" fill="#244333" font-size="14" font-weight="600">Review → apply → verify</text>
        </g>
        <rect x="360" y="77" width="335" height="292" rx="16" fill="#c8ceb5"/>
        <text x="382" y="111" fill="#314c3b" font-size="16" font-weight="600">One visual language</text>
        <rect x="382" y="133" width="291" height="62" rx="12" fill="#aab89a"/>
        <rect x="397" y="149" width="119" height="8" rx="4" fill="#526e53"/>
        <rect x="397" y="167" width="183" height="6" rx="3" fill="#829471"/>
        <g transform="translate(382 214)">
          <rect width="89" height="104" rx="12" fill="#365846"/>
          <rect x="101" width="89" height="104" rx="12" fill="#6b876b"/>
          <rect x="202" width="89" height="104" rx="12" fill="#97a67c"/>
          <circle cx="44" cy="39" r="15" fill="#a6d6bd"/>
          <circle cx="145" cy="39" r="15" fill="#dce3c9"/>
          <circle cx="246" cy="39" r="15" fill="#edf0dd"/>
          <text x="21" y="81" fill="#e1ebd9" font-size="12">GTK / Qt</text>
          <text x="120" y="81" fill="#edf0dd" font-size="12">Terminal</text>
          <text x="230" y="81" fill="#314c3b" font-size="12">Shell</text>
        </g>
      </g>
      <text x="1365" y="573" text-anchor="end" fill="#91aa9c" font-size="13">WORKSPACE ILLUSTRATION · NOT A SCREENSHOT</text>
    </g>
  </g>
</svg>
