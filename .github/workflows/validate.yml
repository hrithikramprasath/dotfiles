name: Validate dotfiles
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install validation tools
        run: pacman -Syu --needed --noconfirm git diffutils python chezmoi jq nodejs fish niri qt6-declarative glslang
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source and isolated restore
        run: python scripts/validate.py
      - name: Run behavior regressions
        run: python -m unittest discover -s tests -v
      - name: Check current desktop package availability
        run: python scripts/check-packages.py
